stages:
  - test
  - quality

.default_rules: &default_rules
  - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  - if: $CI_PIPELINE_SOURCE == "web"

maven-tests:
  stage: test
  rules: *default_rules
  script:
    - mvn -B -ntp clean test
  artifacts:
    when: always
    reports:
      junit:
        - target/surefire-reports/TEST-*.xml
    paths:
      - target/surefire-reports/
    expire_in: 1 week

qodana:
  stage: quality
  variables:
    GIT_DEPTH: 0
  rules: *default_rules
  script:
    - mkdir -p .qodana/results .qodana/cache
    - QODANA_EXIT=0
    - >
      docker run --rm
      --user "$(id -u):$(id -g)"
      -v "$CI_PROJECT_DIR":/data/project
      -v "$CI_PROJECT_DIR/.qodana/results":/data/results
      -v "$CI_PROJECT_DIR/.qodana/cache":/data/cache
      jetbrains/qodana-jvm-community:2025.2
      --save-report || QODANA_EXIT=$?
    - python3 .ci/qodana_summary.py
    - 'echo "Qodana a terminé avec le code $QODANA_EXIT (255 = seuil de problèmes dépassé)"'
    - exit $QODANA_EXIT
  artifacts:
    when: always
    paths:
      - .qodana/results/
    reports:
      codequality: gl-code-quality-report.json
    expire_in: 1 week