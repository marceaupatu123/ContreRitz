image: jetbrains/qodana-jvm-community:2025.2

stages:
  - quality

qodana:
  stage: quality
  variables:
    GIT_DEPTH: 0

  cache:
    key: qodana-cache-$CI_COMMIT_REF_SLUG
    paths:
      - .qodana/cache

  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_PIPELINE_SOURCE == "web"

  script:
    - qodana --cache-dir=$CI_PROJECT_DIR/.qodana/cache --results-dir=$CI_PROJECT_DIR/.qodana/results --save-report

  artifacts:
    when: always
    paths:
      - .qodana/results/
    expire_in: 1 week