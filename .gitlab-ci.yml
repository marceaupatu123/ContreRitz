stages:
  - test
  - quality
  - review

workflow:
  auto_cancel:
    on_new_commit: interruptible

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"

default:
  interruptible: true
  cache:
    key:
      files:
        - pom.xml
    paths:
      - .m2/repository
      - .qodana/cache

.default_rules: &default_rules
  - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  - if: $CI_PIPELINE_SOURCE == "web"

maven-tests:
  stage: test
  rules: *default_rules
  script:
    - mvn -B -ntp clean test
  after_script:
    - python3 .ci/coverage_summary.py
  coverage: '/Couverture des lignes \(service \+ repository\) : (\d+(?:\.\d+)?)%/'
  artifacts:
    when: always
    reports:
      junit:
        - target/surefire-reports/TEST-*.xml
      coverage_report:
        coverage_format: jacoco
        path: target/site/jacoco/jacoco.xml
    paths:
      - target/surefire-reports/
      - target/site/jacoco/
    expire_in: 1 week

qodana:
  stage: quality
  variables:
    GIT_DEPTH: 0
  rules: *default_rules
  script:
    - mkdir -p .qodana/results .qodana/cache
    - QODANA_EXIT=0
    - >
      docker run --rm
      --user "$(id -u):$(id -g)"
      -v "$CI_PROJECT_DIR":/data/project
      -v "$CI_PROJECT_DIR/.qodana/results":/data/results
      -v "$CI_PROJECT_DIR/.qodana/cache":/data/cache
      jetbrains/qodana-jvm-community:2025.2
      --save-report || QODANA_EXIT=$?
    - python3 .ci/qodana_summary.py
    - 'echo "Qodana a terminé avec le code $QODANA_EXIT (255 = seuil de problèmes dépassé)"'
    - exit $QODANA_EXIT
  artifacts:
    when: always
    paths:
      - .qodana/results/
    reports:
      codequality: gl-code-quality-report.json
    expire_in: 1 week

approval-check:
  stage: review
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  cache: []
  script:
    - python3 .ci/approval_check.py
