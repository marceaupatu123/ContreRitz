# Nom de l'application
spring.application.name=contre-ritz

# Base de données H2 sauvegardée dans un fichier local
spring.datasource.url=jdbc:h2:file:./data/contreritzdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Interface web pour voir les tables dans le navigateur
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Crée et met à jour automatiquement les tables SQL à partir de nos classes Java
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true