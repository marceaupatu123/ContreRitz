# Nom de l'application
spring.application.name=contre-ritz

# TODO: Ne pas garder en production!
spring.profiles.active=dev

# Base de donnees H2 sauvegarde dans un fichier local
spring.datasource.url=jdbc:h2:file:/home/marceau/ContreRitz2/data/contreritzdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=test

# Interface web pour voir les tables dans le navigateur
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Cree et met à jour automatiquement les tables SQL à partir de nos classes Java
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Cree les tables des passkeys (schema.sql) au demarrage mais après les trucs JPA.
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
